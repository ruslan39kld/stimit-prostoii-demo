        function renderConveyor(mode, activeAgentId) {
          const activeIndex = activeAgentId
            ? AGENTS.findIndex(function (a) {
                return a.id === activeAgentId;
              })
            : -1;

          const statusHeader =
            mode === 'idle'
              ? 'Все агенты в режиме ожидания'
              : mode === 'final'
                ? '6 / 6 этапов завершено'
                : `Этап ${activeIndex + 1} из 6`;

          const cardsHtml = AGENTS.map(function (agent, index) {
            let status = 'waiting';
            if (mode === 'final') {
              status = 'done';
            } else if (mode === 'step' && activeIndex >= 0) {
              if (index < activeIndex) status = 'done';
              else if (index === activeIndex) status = 'working';
              else status = 'waiting';
            }

            const isWorking = status === 'working';
            const isDone = status === 'done';
            const isFinalReporter = mode === 'final' && index === AGENTS.length - 1;

            const cardClass = isWorking
              ? 'bg-white text-[#0F172A] border-white shadow-md scale-[1.01]'
              : isDone
                ? `bg-white/[0.14] text-white border-white/25 ${isFinalReporter ? 'scale-[1.01]' : ''}`
                : `bg-white/[0.06] text-white/85 border-white/[0.12] ${mode !== 'idle' ? 'opacity-70' : ''}`;

            const statusBadge = isDone
              ? `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-emerald-400/20 text-emerald-300" aria-label="Завершено">${ICONS.check('w-3.5 h-3.5')}</span>`
              : isWorking
                ? `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-[#1B3A6B]/10 text-[#1B3A6B]" aria-label="Работает">${ICONS.loader('w-3.5 h-3.5 animate-spin')}</span>`
                : `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-white/10 text-white/60" aria-label="Ожидает">${ICONS.clock('w-3 h-3')}</span>`;

            const statusText = isWorking
              ? 'работает'
              : isDone
                ? isFinalReporter
                  ? 'отчёт готов'
                  : 'готово'
                : 'ожидает';

            const arrowHtml =
              index < AGENTS.length - 1
                ? `<span class="hidden lg:block absolute -right-2.5 top-1/2 -translate-y-1/2 text-white/35 z-10 pointer-events-none">${ICONS.chevronRight('w-4 h-4')}</span>`
                : '';

            return `
              <div class="relative rounded-lg px-3 py-2.5 border transition-all ${cardClass}">
                <div class="flex items-center justify-between gap-1.5 mb-1">
                  <span class="font-mono text-[11px] font-semibold tabular-nums ${isWorking ? 'text-[#1B3A6B]' : 'text-white/70'}">0${agent.order}</span>
                  <span class="shrink-0">${statusBadge}</span>
                </div>
                <div class="text-sm font-bold leading-snug truncate ${isWorking ? 'text-[#0F172A]' : 'text-white'}">${esc(agent.name)}</div>
                <div class="text-[11px] mt-0.5 font-medium flex items-center gap-1 ${
                  isWorking ? 'text-[#1B3A6B]' : isDone ? 'text-emerald-200' : 'text-white/65'
                }">
                  <span>${statusText}</span>
                </div>
                ${arrowHtml}
              </div>
            `;
          }).join('');

          return `

                      <p class="mt-1.5 text-sm sm:text-base text-slate-900 leading-relaxed font-medium">
                        ${esc(currentStep.alternativeReply.response)}
                      </p>
                    </div>
                  </div>
                  <div class="flex justify-end">
                    <button type="button" data-action="close-alt-comment" class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 bg-white border border-slate-200 rounded-md hover:bg-slate-100 transition-colors cursor-pointer">
                      Скрыть комментарий
                    </button>
                  </div>
                </div>
              `
              : '';

          const replyButtonsHtml = currentStep.primaryReply
            ? `
              <div class="pt-4 border-t border-slate-200 flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <button type="button" data-action="next-step" class="flex-1 py-3.5 px-6 inline-flex items-center justify-center gap-2 text-base font-bold text-white bg-[#1B3A6B] rounded-lg hover:bg-[#142D54] active:scale-[0.99] transition-all cursor-pointer shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B] focus-visible:ring-offset-2">
                  <span>${esc(currentStep.primaryReply)}</span>
                  ${ICONS.arrowRight('w-4 h-4 shrink-0')}
                </button>
                <button type="button" data-action="open-alt-comment" class="py-3.5 px-5 inline-flex items-center justify-center text-sm sm:text-base font-semibold text-slate-700 bg-slate-100 border border-slate-200 rounded-lg hover:bg-slate-200 hover:text-slate-900 transition-all cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400">
                  ${esc(currentStep.alternativeReply.label)}
                </button>
              </div>
            `
            : '';

          document.getElementById('view-root').innerHTML = `
            <div class="space-y-5 sm:space-y-6">
              <div class="bg-white border border-slate-200 rounded-xl px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="min-w-0">
                  <div class="text-xs font-medium text-slate-500">Сценарий ${scenario.number} · Роль: ${esc(scenario.role)}</div>
                  <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 mt-0.5 truncate">${esc(scenario.cardTitle)}</h1>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                  ${backBtn}
                  <div class="px-3.5 py-1.5 rounded-lg bg-[#1B3A6B]/[0.08] border border-[#1B3A6B]/20 text-[#1B3A6B] font-mono text-xs sm:text-sm font-bold tabular-nums whitespace-nowrap">
                    Шаг ${state.stepIndex + 1} из ${scenario.totalSteps}
                  </div>
                </div>
              </div>

              ${renderConveyor(currentStep.kind === 'final_report' ? 'final' : 'step', currentStep.agentId)}
              ${handoffHtml}

              <div class="bg-white border border-slate-200 rounded-xl p-5 sm:p-7 space-y-6 step-enter">
                ${agentHeaderHtml}
                ${bodyHtml}
                ${altBoxHtml}
                ${replyButtonsHtml}
              </div>
            </div>
          `;

          if (currentStep.kind === 'final_report') {
            animateCounter(currentStep.totalShiftRubles);
          }
        }

        function animateCounter(target) {
          if (state.counterRafId) {
            cancelAnimationFrame(state.counterRafId);
            state.counterRafId = null;
          }

          const el = document.getElementById('animated-loss-counter');
          if (!el) return;

          const prefersReducedMotion =
            typeof window !== 'undefined' &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          const formatter = new Intl.NumberFormat('ru-RU');
          if (prefersReducedMotion) {
            el.textContent = formatter.format(target) + ' ₽';
            return;
          }

          const durationMs = 950;
          const startTime = performance.now();
          el.textContent = '0 ₽';

          function tick(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / durationMs, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            const current = Math.round(eased * target);
            const node = document.getElementById('animated-loss-counter');
            if (!node) return;
            node.textContent = formatter.format(current) + ' ₽';
            if (progress < 1) {
              state.counterRafId = requestAnimationFrame(tick);
            } else {
              node.textContent = formatter.format(target) + ' ₽';
              state.counterRafId = null;
            }
          }

          state.counterRafId = requestAnimationFrame(tick);
        }

        function renderFreeQuestionBar() {
          const responseHtml =
            state.submittedQuery !== null
              ? `
                <div role="status" aria-live="polite" class="mt-4 pt-4 border-t border-slate-200">
                  <div class="flex items-start gap-3">
                    ${ICONS.info('w-5 h-5 text-[#1B3A6B] shrink-0 mt-0.5')}
                    <div class="flex-1 min-w-0">
                      <p class="text-xs text-slate-500 mb-1">Ваш запрос: «${esc(state.submittedQuery)}»</p>
                      <p class="text-sm sm:text-base font-medium text-slate-900">
                        Это демо-стенд: показан сценарий работы системы на готовых данных. Выбери один из примеров ниже
                      </p>
                      <div class="mt-3 flex flex-wrap gap-2.5">
                        ${SCENARIOS.map(function (sc) {
                          return `
                            <button type="button" data-action="start-scenario" data-scenario-id="${sc.id}" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs sm:text-sm font-semibold text-[#1B3A6B] bg-[#1B3A6B]/[0.08] border border-[#1B3A6B]/20 rounded-lg hover:bg-[#1B3A6B] hover:text-white transition-colors cursor-pointer">
                              <span>Сценарий ${sc.number}: ${esc(sc.cardTitle)}</span>
                              ${ICONS.arrowRight('w-3.5 h-3.5 shrink-0')}
                            </button>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  </div>
                </div>
              `
              : '';

          document.getElementById('free-question-root').innerHTML = `
            <section aria-label="Поле свободного вопроса" class="bg-white border border-slate-200 rounded-xl p-4 sm:p-5">
              <form id="free-question-form" class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <label for="free-question-input" class="sr-only">Написать свой вопрос</label>
                <input
                  id="free-question-input"
                  type="text"
                  placeholder="Написать свой вопрос…"
                  class="flex-1 min-w-0 h-11 px-4 text-sm sm:text-base text-slate-900 bg-slate-50 border border-slate-200 rounded-lg placeholder:text-slate-400 focus:outline-none focus:bg-white focus:border-[#1B3A6B] focus:ring-2 focus:ring-[#1B3A6B]/15 transition-colors"
                />
                <button type="submit" class="h-11 px-5 inline-flex items-center justify-center gap-2 text-sm font-semibold text-white bg-[#1B3A6B] rounded-lg hover:bg-[#142D54] active:scale-[0.99] transition-all whitespace-nowrap shrink-0 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B] focus-visible:ring-offset-2">
                  <span>Отправить</span>
                  ${ICONS.send('w-4 h-4')}
                </button>
              </form>
              ${responseHtml}
            </section>
          `;
        }

        function renderMain() {
          renderHeader();
          const scenario = state.activeScenarioId
            ? SCENARIOS.find(function (s) {
                return s.id === state.activeScenarioId;
              }) || null
            : null;
          if (scenario) {
            renderScenarioView(scenario);
          } else {
            renderHomeView();
          }
        }

        // === 5. ОБРАБОТЧИКИ СОБЫТИЙ ===
        function startScenario(scenarioId) {
          state.activeScenarioId = scenarioId;
          state.stepIndex = 0;
          state.altCommentOpen = false;
          state.handoffBanner = null;
          state.selectedOption = null;
          state.showOtherScenarios = false;
          state.submittedQuery = null;
          renderMain();
          renderFreeQuestionBar();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
          state.activeScenarioId = null;
          state.stepIndex = 0;
          state.altCommentOpen = false;
          state.handoffBanner = null;
          state.selectedOption = null;
          state.showOtherScenarios = false;
          renderMain();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('click', function (e) {
          const target = e.target.closest('[data-action]');
          if (!target) return;

          const action = target.getAttribute('data-action');

          if (action === 'go-home') {
            goHome();
            return;
          }

          if (action === 'start-scenario') {
            const scenarioId = target.getAttribute('data-scenario-id');
            if (scenarioId) startScenario(scenarioId);
            return;
          }

          const scenario = SCENARIOS.find(function (s) {
            return s.id === state.activeScenarioId;
          });
          if (!scenario) return;
          const currentStep = scenario.steps[state.stepIndex];

          if (action === 'next-step') {
            state.altCommentOpen = false;
            state.handoffBanner = currentStep.handoffNote || null;
            state.stepIndex = Math.min(state.stepIndex + 1, scenario.steps.length - 1);
            renderMain();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          if (action === 'prev-step') {
            if (state.stepIndex > 0) {
              state.altCommentOpen = false;
              state.handoffBanner = null;
              state.showOtherScenarios = false;
              state.stepIndex = Math.max(0, state.stepIndex - 1);
              renderMain();
            }
            return;
          }

          if (action === 'open-alt-comment') {
            state.altCommentOpen = true;
            renderMain();
            return;
          }

          if (action === 'close-alt-comment') {
            state.altCommentOpen = false;
            renderMain();
            return;
          }

          if (action === 'choose-priority') {
            const optionId = target.getAttribute('data-option-id');
            if (currentStep.options) {
              const found = currentStep.options.find(function (o) {
                return o.id === optionId;
              });
              if (found) {
                state.selectedOption = found;
                state.altCommentOpen = false;
                state.handoffBanner = null;
                state.stepIndex = Math.min(state.stepIndex + 1, scenario.steps.length - 1);
                renderMain();
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
            }
            return;
          }

          if (action === 'toggle-other-scenarios') {
            state.showOtherScenarios = !state.showOtherScenarios;
            renderMain();
          }
        });

        document.addEventListener('submit', function (e) {
          if (e.target && e.target.id === 'free-question-form') {
            e.preventDefault();
            const input = document.getElementById('free-question-input');
            if (!input) return;
            const trimmed = input.value.trim();
            if (!trimmed) return;
            state.submittedQuery = trimmed;
            renderFreeQuestionBar();
          }
        });

        // === 6. ИНИЦИАЛИЗАЦИЯ ===
        renderMain();
        renderFreeQuestionBar();
      })();
    </script>
  </body>
</html>
